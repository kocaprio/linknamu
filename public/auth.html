<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | 링크나무</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="center-page">
  <div class="panel">
    <p style="margin:0 0 18px"><a class="logo" href="/">🌳 링크나무</a></p>
    <h1 id="title">로그인</h1>
    <p class="muted" id="subtitle" style="margin:0 0 20px">내 링크 페이지를 관리하세요.</p>

    <form id="form" novalidate>
      <div class="field">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <p class="hint" id="username-hint" hidden>내 페이지 주소가 됩니다: <strong id="preview-url"></strong></p>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <p class="hint" id="password-hint" hidden>8자 이상 입력해 주세요.</p>
      </div>
      <p class="error" id="error" role="alert"></p>
      <button class="btn" type="submit" id="submit" style="width:100%">로그인</button>
    </form>

    <p class="muted" style="text-align:center;margin:18px 0 0;font-size:14px" id="switch"></p>
  </div>
</main>

<script>
  const isSignup = location.pathname === '/signup';
  const $ = (id) => document.getElementById(id);

  if (isSignup) {
    document.title = '회원가입 | 링크나무';
    $('title').textContent = '회원가입';
    $('subtitle').textContent = '아이디 하나로 나만의 링크 페이지가 생겨요.';
    $('submit').textContent = '가입하고 시작하기';
    $('username-hint').hidden = false;
    $('password-hint').hidden = false;
    $('password').autocomplete = 'new-password';
    $('switch').innerHTML = '이미 계정이 있나요? <a href="/login">로그인</a>';
    const updatePreview = () => {
      $('preview-url').textContent = location.host + '/@' + ($('username').value.trim().toLowerCase() || '아이디');
    };
    $('username').addEventListener('input', updatePreview);
    updatePreview();
  } else {
    $('switch').innerHTML = '처음이신가요? <a href="/signup">회원가입</a>';
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('error').textContent = '';
    $('submit').disabled = true;
    try {
      const res = await fetch(isSignup ? '/api/signup' : '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: $('username').value, password: $('password').value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '요청에 실패했습니다.');
      location.href = '/admin';
    } catch (err) {
      $('error').textContent = err.message;
      $('submit').disabled = false;
    }
  });
</script>
</body>
</html>
