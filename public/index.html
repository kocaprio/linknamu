<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>링크나무</title>
<meta name="description" content="내 모든 링크를 한 페이지에 모아 두고, 하나의 URL로 공유하세요.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="/">🌳 링크나무</a>
  <a class="btn btn-ghost btn-sm" href="/login">로그인</a>
</header>

<section class="hero">
  <span style="font-size:56px" aria-hidden="true">🌳</span>
  <h1>내 모든 링크를<br><em>하나의 주소</em>로</h1>
  <p>인스타그램, 유튜브, 블로그, 깃허브… 흩어진 링크를 한 페이지에 모아 SNS 프로필에 하나만 걸어 두세요.</p>
  <div class="hero-actions">
    <a class="btn" href="/signup">무료로 시작하기</a>
    <a class="btn btn-ghost" href="/login">로그인</a>
  </div>
</section>

<section class="features">
  <div class="feature">
    <div class="emoji" aria-hidden="true">🙋</div>
    <h3>프로필</h3>
    <p>이름, 한 줄 소개, 프로필 사진으로 나를 소개해요.</p>
  </div>
  <div class="feature">
    <div class="emoji" aria-hidden="true">🔗</div>
    <h3>링크 카드</h3>
    <p>SNS·블로그 링크를 보기 좋은 카드로 나열해요.</p>
  </div>
  <div class="feature">
    <div class="emoji" aria-hidden="true">📈</div>
    <h3>클릭 수 집계</h3>
    <p>어떤 링크가 많이 눌렸는지 링크별로 확인해요.</p>
  </div>
</section>
</body>
</html>
